name: Feature idea
description: Suggest something Zero should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your budget that Zero makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How you'd like it to work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it now
      description: Workarounds, or how another app does it.
