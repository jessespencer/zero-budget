name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo is public: fail on private IPs, emails, tailnet hosts, home
      # paths or DB/env files in what this push or PR adds — even if the
      # pre-commit hook was skipped. (The personal denylist only runs locally.)
      - name: Privacy scan
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
             || ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "No earlier commit to compare against; skipping."
            exit 0
          fi
          bash .claude/skills/pr/scripts/scan.sh "$base"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Added 2026-07-19. tsc had two pre-existing failures in test fixtures
      # for months, so this step couldn't be switched on -- which meant type
      # errors were never checked by anything automatic. Fixtures fixed, gate
      # on.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run
